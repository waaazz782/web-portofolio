<!-- SKILLS COMPONENT -->
<div class="glass-card skills-card" id="skills-section">
  <div class="card-header-bar">
    <div class="card-dot-title">
      <span class="purple-indicator-dot"></span>
      <h3 class="card-title">Skills</h3>
    </div>
    <span class="card-tag">Core Stack</span>
  </div>

  <div class="skills-card-content">
    <!-- Left: Skill Bars -->
    <div class="skills-bars-list">
      
      <div class="skill-item">
        <div class="skill-label-row">
          <div class="skill-tech-name">
            <svg viewBox="0 0 24 24" class="skill-icon-svg" fill="none">
              <path d="M14.3 2.1L3.9 12.5l3.2 3.2L19.5 3.3z" fill="#38BDF8"/>
              <path d="M14.3 14.3l-4.2 4.2 3.2 3.2 5.8-5.8z" fill="#0284C7"/>
              <path d="M7.1 15.7l3.2 3.2 3.2-3.2-3.2-3.2z" fill="#0EA5E9"/>
            </svg>
            <span>Flutter</span>
          </div>
          <span class="skill-percent">90%</span>
        </div>
        <div class="skill-progress-track">
          <div class="skill-progress-fill" style="width: 90%;"></div>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-label-row">
          <div class="skill-tech-name">
            <i data-lucide="code" class="skill-icon-lucide"></i>
            <span>Dart</span>
          </div>
          <span class="skill-percent">85%</span>
        </div>
        <div class="skill-progress-track">
          <div class="skill-progress-fill" style="width: 85%;"></div>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-label-row">
          <div class="skill-tech-name">
            <i data-lucide="database" class="skill-icon-lucide text-amber"></i>
            <span>Firebase</span>
          </div>
          <span class="skill-percent">80%</span>
        </div>
        <div class="skill-progress-track">
          <div class="skill-progress-fill" style="width: 80%;"></div>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-label-row">
          <div class="skill-tech-name">
            <i data-lucide="layout" class="skill-icon-lucide text-purple"></i>
            <span>UI/UX Design</span>
          </div>
          <span class="skill-percent">75%</span>
        </div>
        <div class="skill-progress-track">
          <div class="skill-progress-fill" style="width: 75%;"></div>
        </div>
      </div>

    </div>

    <!-- Right: Orbit Logo Stack -->
    <div class="skills-orbit-widget">
      <div class="orbit-system">

        <div class="orbit-path-ring orbit-path-ring--1"></div>
        <div class="orbit-path-ring orbit-path-ring--2"></div>
        <div class="orbit-path-ring orbit-path-ring--3"></div>
        <div class="orbit-path-ring orbit-path-ring--4"></div>

        <span class="orbit-particle orbit-particle--1"></span>
        <span class="orbit-particle orbit-particle--2"></span>
        <span class="orbit-particle orbit-particle--3"></span>
        <span class="orbit-particle orbit-particle--4"></span>
        <span class="orbit-particle orbit-particle--5"></span>
        <span class="orbit-particle orbit-particle--6"></span>
        <span class="orbit-particle orbit-particle--7"></span>
        <span class="orbit-particle orbit-particle--8"></span>

        <div class="orbit-logo-wrap orbit-node--1" data-name="Dart">
          <img src="https://cdn.simpleicons.org/dart/38BDF8" alt="Dart" class="orbit-logo-img" loading="lazy">
        </div>
        <div class="orbit-logo-wrap orbit-node--2" data-name="Firebase">
          <img src="https://cdn.simpleicons.org/firebase/FFCA28" alt="Firebase" class="orbit-logo-img" loading="lazy">
        </div>
        <div class="orbit-logo-wrap orbit-node--3" data-name="Figma">
          <img src="https://cdn.simpleicons.org/figma/F24E1E" alt="Figma" class="orbit-logo-img" loading="lazy">
        </div>
        <div class="orbit-logo-wrap orbit-node--4" data-name="Git">
          <img src="https://cdn.simpleicons.org/git/F05032" alt="Git" class="orbit-logo-img" loading="lazy">
        </div>
        <div class="orbit-logo-wrap orbit-node--5" data-name="VS Code">
          <img src="https://cdn.simpleicons.org/vscode/38BDF8" alt="VS Code" class="orbit-logo-img" loading="lazy">
        </div>
        <div class="orbit-logo-wrap orbit-node--6" data-name="HTML5">
          <img src="https://cdn.simpleicons.org/html5/E34F26" alt="HTML5" class="orbit-logo-img" loading="lazy">
        </div>

        <!-- Center: Flutter logo -->
        <div class="orbit-center-hub">
          <div class="orbit-center-glow"></div>
          <img src="https://cdn.simpleicons.org/flutter/02569B" alt="Flutter" class="orbit-center-logo">
        </div>

      </div>
    </div>

  </div>
</div>
